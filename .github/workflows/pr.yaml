name: charm tests

on:
  workflow_call:
  pull_request:

jobs:
  inclusive-naming:
    name: Inclusive naming
    uses: canonical/Inclusive-naming/.github/workflows/woke.yaml@main
    with:
      fail-on-error: "false"

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  linting:
    name: Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        run: |
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv
          tox -e lint

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Static analysis
        run: |
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv
          tox -e static

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unit tests
        run: |
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv
          tox -e unit

  pack-charm:
    name: Pack the charm
    needs:
      - linting
      - static-analysis
      - unit-tests
    uses: ./.github/workflows/pack.yaml
    with:
      name: microcluster-token-distributor

  setup:
    name: Setup tests
    runs-on: ubuntu-latest
    needs:
      - pack-charm
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Discover individual tests
        id: discover
        run: |
          tox -e integration -- --version
          tests=$(tox -e integration -- -qq --collect-only tests/integration/ | grep ::test_ | jq -R -s -c 'split("\n")[:-1]')
          echo $tests
          echo "matrix={\"test\":$tests}" >> $GITHUB_OUTPUT

  test:
    name: Integration test (${{ matrix.test }})
    runs-on: ubuntu-latest
    needs:
      - pack-charm
      - setup
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.setup.outputs.matrix).test }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./charms

      - name: Set charm path
        run: |
          CHARM_PATH=$(find ./charms -type f -name "*.charm" -print -quit)
          echo "TOKEN_DISTRIBUTOR_CHARM_PATH=$CHARM_PATH" >> $GITHUB_ENV
          echo "Charm path: $CHARM_PATH"

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv
          sudo snap install concierge --classic

      - name: Prepare Environment
        run: |
          cat <<EOF > /tmp/concierge.yaml
          juju:
            channel: 3.6/stable

          providers:
            lxd:
              enable: true
              bootstrap: true
          EOF

          sudo concierge prepare -c /tmp/concierge.yaml

      - name: Run tests
        run: make check-integration TESTSUITEFLAGS="${{ matrix.test }}"
