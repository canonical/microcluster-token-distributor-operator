type: charm

name: microcluster-token-distributor
title: Microcluster Token Distrbutor Charm
summary: A distributon method for microocluster tokens
description: |
  A mirror to allow microcluster charms to distribute join tokens without using
  the peer relation. This was created for the microovn charm but it should be
  able to be used on any microcluster.

links:
  contact: OVN Engineering <ubuntu-ovn-eng@lists.launchpad.net>

platforms:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-packages:
      - git
    build-snaps:
      - astral-uv
    override-build: |
      craftctl default
      git describe --always || echo "unknown-$(date -u +%Y%m%d%H%M%S)" > $CRAFT_PART_INSTALL/version

config:
  options:
    log-level:
      default: "info"
      type: string

peers:
  cluster:
    interface: worker-cluster

provides:
  microcluster-cluster:
    interface: worker-cluster
